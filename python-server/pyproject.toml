[project]
name = "fanout-py"
version = "1.0.0"
description = "Kafka to TCP fan-out server on asyncio (the Python side of the benchmark)"
requires-python = ">=3.12"
dependencies = ["aiokafka>=0.11", "orjson>=3.10", "uvloop>=0.20"]

[project.scripts]
fanout-py = "fanout_py.__main__:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fanout_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["fanout_py"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["ASYNC109", "ASYNC110"]

[tool.mypy]
python_version = "3.12"
packages = ["fanout_py"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true
