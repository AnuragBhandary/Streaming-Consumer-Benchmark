[project]
name = "bench"
version = "1.0.0"
description = "One load harness for both fan-out servers: Kafka producer, TCP client swarm, experiment runner, report"
requires-python = ">=3.12"
dependencies = ["aiokafka>=0.11", "orjson>=3.10", "uvloop>=0.20"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]
report = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["ASYNC109", "ASYNC110", "ASYNC221", "SIM115"]

[tool.mypy]
python_version = "3.12"
packages = ["bench"]
mypy_path = "src"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["aiokafka.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/bench/report.py" = ["E501"]
